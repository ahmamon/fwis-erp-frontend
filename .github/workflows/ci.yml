name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Add a "Lint"/"Test" step here once tooling exists (e.g. vitest).
      - name: Report failures
        if: failure()
        run: echo "::error::Frontend build failed. See the 'Build' step above."